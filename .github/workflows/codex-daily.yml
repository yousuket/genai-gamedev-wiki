name: Codex daily collect

# 日次の情報収集を Codex で行う。手順は agents/daily-collect.md、切り替え方は agents/OPERATIONS.md。
# 定期実行は、リポジトリ変数 CODEX_SCHEDULE が true のときだけ動く（手動の実行は常に動く）。

on:
  schedule:
    - cron: '7 21 * * *' # 毎日 06:07 JST
  workflow_dispatch:

concurrency:
  group: wiki-content
  cancel-in-progress: false

jobs:
  # Codex がファイルを書き換える。このジョブには GitHub への書き込み権限を渡さない
  codex:
    if: github.event_name == 'workflow_dispatch' || vars.CODEX_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/daily.md
          # フィードの取得にネットワークが要る。使い捨てのランナーなので全権限で動かす（sudo は外される）
          sandbox: danger-full-access
          model: ${{ vars.CODEX_MODEL }}
          effort: ${{ vars.CODEX_EFFORT }}
          output-file: ${{ runner.temp }}/codex-output.md
      - name: Save changes
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: codex-daily
          path: |
            ${{ runner.temp }}/changes.patch
            ${{ runner.temp }}/codex-output.md
          if-no-files-found: warn
          retention-days: 14

  # 変更の範囲を確かめてから commit と push を行う（Codex が触った作業ツリーは使わない）
  publish:
    needs: codex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: codex-daily
          path: ${{ runner.temp }}/codex
      - name: Apply changes
        run: |
          patch="$RUNNER_TEMP/codex/changes.patch"
          if [ ! -s "$patch" ]; then echo "変更なし"; exit 0; fi
          git apply --index "$patch"
          # 日次収集が変えてよいのは research/ だけ
          outside=$(git diff --cached --name-only | grep -v '^research/' || true)
          if [ -n "$outside" ]; then
            echo "::error::research/ の外のファイルが変更されています:"; echo "$outside"; exit 1
          fi
      - name: Commit and push
        run: |
          if git diff --cached --quiet; then echo "コミットする変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: daily log $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
